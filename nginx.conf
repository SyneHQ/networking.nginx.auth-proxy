worker_processes auto;
pid /tmp/auth-proxy/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

env JWT_SALT;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_TIMEOUT;
env REDIS_CACHE_TTL;
env REDIS_PASSWORD;
env REDIS_KEY_PREFIX;
env POSTGRES_HOST;
env POSTGRES_PORT;
env POSTGRES_DB;
env POSTGRES_USER;
env POSTGRES_PASSWORD;
env USER_TABLE;
env USER_ID_FIELD;
env ENABLE_DB_CHECK;
env ALLOW_LOCAL_BYPASS;
env LOCAL_BYPASS_HEADER;
env LOCAL_BYPASS_VALUE;
env TOKEN_ISSUER;
env TOKEN_AUDIENCE;

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/auth-proxy/client-body;
    proxy_temp_path /tmp/auth-proxy/proxy;
    fastcgi_temp_path /tmp/auth-proxy/fastcgi;
    uwsgi_temp_path /tmp/auth-proxy/uwsgi;
    scgi_temp_path /tmp/auth-proxy/scgi;
    resolver __DNS_RESOLVER__ valid=30s ipv6=off;
    client_max_body_size 1024m;
    lua_shared_dict jwt_cache 30m;
    lua_package_path "/etc/nginx/lua/?.lua;;";

    server {
        listen 8080;
        server_name _;
        location = /healthz { return 200 "ok\n"; }

    }
    
    server {
        listen 8080;
        server_name kole.synehq.com;

        set $cors_origin "https://data.synehq.com";
        if ($http_origin = "https://playground.synehq.com") {
            set $cors_origin "https://playground.synehq.com";
        }

        # Stream protocol headers required by useChat ↔ Kole (data-stream / UI-SSE).
        set $cors_allow_headers "Content-Type, Authorization, x-admin-token, x-api-key, x-user-id, x-vercel-ai-data-stream, x-vercel-ai-ui-message-stream, x-kole-stream-protocol";
        set $cors_expose_headers "x-vercel-ai-data-stream, x-vercel-ai-ui-message-stream";

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers $cors_allow_headers always;
        add_header Access-Control-Expose-Headers $cors_expose_headers always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

        # Only auth.lua can subrequest this endpoint. It must never expose the
        # decrypt service as a public token oracle.
        location = /verify-jwe {
            internal;
            set $authwall __AUTHWALL_UPSTREAM__;
            proxy_pass http://$authwall/verify;
            proxy_set_header Content-Type application/json;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Host authwall;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
        }

        location / {
            # Answer CORS preflight at the edge so it never depends on the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Headers $cors_allow_headers always;
                add_header Access-Control-Expose-Headers $cors_expose_headers always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                return 204;
            }

            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_ai __KOLE_UPSTREAM__;
            proxy_pass http://$backend_ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 8080;
        server_name paywall.synehq.com;

        location = /verify-jwe {
            internal;
            set $authwall __AUTHWALL_UPSTREAM__;
            proxy_pass http://$authwall/verify;
            proxy_set_header Content-Type application/json;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Host authwall;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
        }

        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_billing __PAYWALL_UPSTREAM__;
            proxy_pass http://$backend_billing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8080;
        server_name cosmos.synehq.com;

        set $cors_origin "https://data.synehq.com";
        if ($http_origin = "https://playground.synehq.com") {
            set $cors_origin "https://playground.synehq.com";
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-admin-token, x-api-key, x-user-id" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

        location = /verify-jwe {
            internal;
            set $authwall __AUTHWALL_UPSTREAM__;
            proxy_pass http://$authwall/verify;
            proxy_set_header Content-Type application/json;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Host authwall;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
        }

        location / {
            # Answer CORS preflight at the edge so it never depends on the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-admin-token, x-api-key, x-user-id" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                return 204;
            }

            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_db __DB_API_UPSTREAM__;
            proxy_pass http://$backend_db;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;

        }
    }

    server {
        listen 8080;
        server_name __APP_HOST__;
        
        location = /verify-jwe {
            internal;
            set $authwall __AUTHWALL_UPSTREAM__;
            proxy_pass http://$authwall/verify;
            proxy_set_header Content-Type application/json;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Host authwall;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
        }
        
        location / {
            access_by_lua_block { require("headers").clear() }
            set $backend_api __APP_UPSTREAM__;
            proxy_pass http://$backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8080;
        http2 on;
        server_name kms.synehq.com;
        
        location = /verify-jwe {
            internal;
            set $authwall __AUTHWALL_UPSTREAM__;
            proxy_pass http://$authwall/verify;
            proxy_set_header Content-Type application/json;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Host authwall;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
        }
        
        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_kms __KMS_UPSTREAM__;
            grpc_pass grpc://$backend_kms;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $remote_addr;
            grpc_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8080;
        server_name get.rabbit.synehq.com;

        location /setup.sh {
            proxy_pass https://raw.githubusercontent.com/SyneHQ/rabbit.go/refs/heads/sudo/scripts/setup.sh;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass https://github.com/synehq;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
