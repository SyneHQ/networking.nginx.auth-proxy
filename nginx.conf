worker_processes auto;
events { worker_connections 1024; }

env JWT_SECRET;
env JWT_SALT;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_TIMEOUT;
env REDIS_CACHE_TTL;
env REDIS_PASSWORD;
env REDIS_KEY_PREFIX;
env POSTGRES_HOST;
env POSTGRES_PORT;
env POSTGRES_DB;
env POSTGRES_USER;
env POSTGRES_PASSWORD;
env USER_TABLE;
env USER_ID_FIELD;
env ENABLE_DB_CHECK;
env ALLOW_BYPASS;
env BYPASS_HEADER;
env BYPASS_HEADER_VALUE;

http {
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 1024m;
    lua_shared_dict jwt_cache 30m;
    lua_package_path "/etc/nginx/lua/?.lua;;";

    upstream backend_ai {
        server kole:8080 max_fails=3 fail_timeout=36000s;
    }

    upstream backend_billing {
        server paywall:8080 max_fails=3 fail_timeout=3600s;
    }

    upstream backend_db {
        server db_api:8080 max_fails=3 fail_timeout=3600s;
    }

    upstream backend_api {
        server app:3001 max_fails=3 fail_timeout=3600s;
    }

    upstream backend_kms {
        server kms:50051 max_fails=3 fail_timeout=3600s;
    }

    upstream decrypt_server {
        server authwall:80 max_fails=3 fail_timeout=3600s;
    }

    server {
        listen 80;
        server_name _;

        location /verify-jwe {
            proxy_pass http://decrypt_server/decrypt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    server {
        listen 80;
        server_name kole.synehq.com;

        set $cors_origin "https://data.synehq.com";
        if ($http_origin = "https://playground.synehq.com") {
            set $cors_origin "https://playground.synehq.com";
        }

        # Stream protocol headers required by useChat ↔ Kole (data-stream / UI-SSE).
        set $cors_allow_headers "Content-Type, Authorization, x-admin-token, x-api-key, x-user-id, x-vercel-ai-data-stream, x-vercel-ai-ui-message-stream, x-kole-stream-protocol";
        set $cors_expose_headers "x-vercel-ai-data-stream, x-vercel-ai-ui-message-stream";

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers $cors_allow_headers always;
        add_header Access-Control-Expose-Headers $cors_expose_headers always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

        location /verify-jwe {
            proxy_pass http://decrypt_server/decrypt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            # Answer CORS preflight at the edge so it never depends on the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Headers $cors_allow_headers always;
                add_header Access-Control-Expose-Headers $cors_expose_headers always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                return 204;
            }

            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_ai kole:8080;
            proxy_pass http://$backend_ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 80;
        server_name paywall.synehq.com;

        location /verify-jwe {
            proxy_pass http://decrypt_server/decrypt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_billing paywall:8080;
            proxy_pass http://$backend_billing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name cosmos.synehq.com;

        set $cors_origin "https://data.synehq.com";
        if ($http_origin = "https://playground.synehq.com") {
            set $cors_origin "https://playground.synehq.com";
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-admin-token, x-api-key, x-user-id" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

        location /verify-jwe {
            proxy_pass http://decrypt_server/decrypt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            # Answer CORS preflight at the edge so it never depends on the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-admin-token, x-api-key, x-user-id" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                return 204;
            }

            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_db db_api:8080;
            proxy_pass http://$backend_db;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;

        }
    }

    server {
        listen 80;
        server_name dashboard.lynxlab.tech;
        
        location /verify-jwe {
            proxy_pass http://decrypt_server/decrypt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_api app:3001;
            proxy_pass http://$backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        http2 on;
        server_name kms.synehq.com;
        
        location /verify-jwe {
            proxy_pass http://decrypt_server/decrypt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            set $backend_kms kms:50051;
            grpc_pass grpc://$backend_kms;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name get.rabbit.synehq.com;

        location /setup.sh {
            proxy_pass https://raw.githubusercontent.com/SyneHQ/rabbit.go/refs/heads/sudo/scripts/setup.sh;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass https://github.com/synehq;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
