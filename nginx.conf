worker_processes auto;
events { worker_connections 1024; }

env JWT_SECRET;
env JWT_SALT;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_TIMEOUT;
env REDIS_CACHE_TTL;
env REDIS_PASSWORD;
env REDIS_KEY_PREFIX;
env POSTGRES_HOST;
env POSTGRES_PORT;
env POSTGRES_DB;
env POSTGRES_USER;
env POSTGRES_PASSWORD;
env USER_TABLE;
env USER_ID_FIELD;
env ENABLE_DB_CHECK;
env ALLOW_BYPASS;
env BYPASS_HEADER;
env BYPASS_HEADER_VALUE;

http {
    lua_shared_dict jwt_cache 10m;
    lua_package_path "/etc/nginx/lua/?.lua;;";

    init_by_lua_block {
        -- Require any necessary Lua libraries
        local cjson = require "cjson"
        local jwt = require "resty.jwt"
        local redis = require "resty.redis"
        local pgmoon = require "pgmoon"
    }

    server {
        listen 80;
        server_name llm.synehq.com;

        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            proxy_pass http://backend_ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name paywall.synehq.com;

        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            proxy_pass http://backend_billing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name cosmos.lynxlab.tech;

        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            proxy_pass http://backend_db;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name dashboard.lynxlab.tech;
        
        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        http2 on;
        server_name kms.synehq.com;
        
        location / {
            access_by_lua_file /etc/nginx/lua/auth.lua;
            grpc_pass grpc://backend_kms;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name docs.synehq.com;
        
        location /docs {
            proxy_pass http://docs:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    upstream backend_ai {
        server kole:8080;
    }

    upstream backend_billing {
        server paywall:8080;
    }

    upstream backend_db {
        server db_api:8080;
    }

    upstream backend_api {
        server app:3001;
    }

    upstream backend_kms {
        server kms:50051;
    }
    
}
